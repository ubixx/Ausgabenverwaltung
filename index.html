<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Budget Cloud Pro</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#6366f1">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1077/1077976.png">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/1077/1077976.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root { --app-primary: #6366f1; --app-bg: #f8fafc; }
        body { 
            background-color: var(--app-bg); 
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            padding-top: env(safe-area-inset-top);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        #splashScreen { transition: opacity 0.5s ease-out; }
        
        #toast {
            visibility: hidden;
            min-width: 280px;
            background-color: #1e293b;
            color: #fff;
            text-align: center;
            border-radius: 16px;
            padding: 20px;
            position: fixed;
            z-index: 9999;
            left: 50%;
            bottom: 40px;
            transform: translateX(-50%);
            font-weight: bold;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
        }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 40px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 40px; opacity: 1;} to {bottom: 0; opacity: 0;} }
        
        .stat-bar-bg { height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; }
        .stat-bar-fill { height: 100%; background: var(--app-primary); transition: width 0.5s ease-in-out; }
    </style>
</head>
<body class="min-h-screen font-sans text-slate-800">

    <div id="toast">Nachricht</div>

    <div id="splashScreen" class="fixed inset-0 bg-white z-[1000] flex flex-col items-center justify-center p-8 text-center">
        <div class="w-20 h-20 bg-indigo-600 text-white rounded-3xl flex items-center justify-center text-4xl mb-4 shadow-2xl">
            <i class="fas fa-wallet"></i>
        </div>
        <p class="text-slate-400 font-bold text-xs uppercase tracking-widest">Initialisiere...</p>
    </div>

    <div id="authScreen" class="hidden min-h-screen flex flex-col items-center justify-center p-6 bg-slate-50 z-50">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] p-8 shadow-2xl text-center">
            <div class="w-16 h-16 bg-indigo-600 text-white rounded-2xl flex items-center justify-center text-3xl mx-auto mb-6 shadow-lg">
                <i class="fas fa-lock"></i>
            </div>
            <h2 class="text-2xl font-black text-slate-900 mb-2">Willkommen</h2>
            <p class="text-slate-400 text-sm mb-6 font-medium">Melde dich an oder registriere dich.</p>
            <form id="authForm" class="space-y-4" onsubmit="event.preventDefault()">
                <input type="email" id="authEmail" placeholder="E-Mail" required class="w-full p-4 bg-slate-50 rounded-2xl font-bold outline-none border-2 border-transparent focus:border-indigo-500">
                <input type="password" id="authPassword" placeholder="Passwort" required class="w-full p-4 bg-slate-50 rounded-2xl font-bold outline-none border-2 border-transparent focus:border-indigo-500">
                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="handleLogin()" class="flex-1 bg-indigo-600 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition-transform">Login</button>
                    <button type="button" onclick="handleRegister()" class="flex-1 bg-slate-900 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition-transform">Neu hier?</button>
                </div>
            </form>
        </div>
    </div>

    <div id="mainApp" class="hidden flex flex-col min-h-screen">
        <header class="p-6 bg-white border-b border-slate-100 sticky top-0 z-30">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <h1 class="text-3xl font-black text-slate-900 tracking-tight" id="totalAmount">0,00 €</h1>
                    <div class="flex items-center gap-2 mt-1">
                        <span id="cloudStatus" class="w-2 h-2 rounded-full bg-slate-300"></span>
                        <p class="text-slate-400 font-bold text-xs uppercase tracking-widest" id="totalCountBadge">0 Einträge</p>
                    </div>
                </div>
                <button onclick="document.getElementById('dataModal').classList.remove('hidden')" class="w-12 h-12 bg-slate-50 text-slate-900 rounded-2xl flex items-center justify-center text-xl active:scale-95 transition-transform">
                    <i class="fas fa-cog"></i>
                </button>
            </div>
            <div class="mt-4 bg-slate-50 rounded-2xl p-4 border border-slate-100">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-widest" id="monthLabel">Monat</span>
                    <span class="text-xs font-bold text-indigo-600" id="monthCountBadge">0 Buchungen</span>
                </div>
                <div class="text-lg font-black text-slate-900 mb-2" id="monthSpending">0,00 €</div>
                <div class="stat-bar-bg"><div class="stat-bar-fill w-0" id="monthBarFill"></div></div>
            </div>
        </header>

        <div class="px-6 py-4 bg-white/95 backdrop-blur-md sticky top-[165px] z-20 border-b border-slate-100">
            <div class="relative">
                <input type="text" id="searchInput" placeholder="Suchen..." onkeyup="renderUI()" class="w-full p-4 pl-12 bg-slate-100/50 border border-transparent rounded-2xl text-sm outline-none focus:bg-white focus:border-indigo-100 transition-all">
                <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            </div>
            <div id="filterBar" class="mt-4 flex gap-2 overflow-x-auto no-scrollbar scroll-container"></div>
        </div>

        <div id="expenseList" class="flex-1 p-6 space-y-4 pb-32 overflow-y-auto"></div>

        <div class="fixed bottom-0 left-0 right-0 p-6 flex justify-center pointer-events-none z-40 mb-[env(safe-area-inset-bottom)]">
            <button id="addExpenseBtn" class="w-full max-w-md bg-indigo-600 text-white font-bold py-5 rounded-2xl flex items-center justify-center gap-3 pointer-events-auto text-lg shadow-xl active:bg-indigo-800 transition-all">
                <i class="fas fa-plus"></i> Neuer Eintrag
            </button>
        </div>
    </div>

    <div id="dataModal" class="hidden fixed inset-0 bg-slate-900/60 z-[700] flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] p-8 shadow-2xl space-y-4">
            <div class="flex justify-between items-center mb-2">
                <h3 class="text-xl font-black">Einstellungen</h3>
                <button onclick="closeModal('dataModal')"><i class="fas fa-times text-slate-400 text-xl"></i></button>
            </div>
            
            <div class="grid grid-cols-2 gap-3">
                <button onclick="exportToCSV()" class="bg-slate-50 text-slate-900 font-bold py-4 rounded-xl text-xs border border-slate-100 flex flex-col items-center justify-center gap-2">
                    <i class="fas fa-file-export text-lg text-indigo-600"></i> Excel Export
                </button>
                <label class="bg-slate-50 text-slate-900 font-bold py-4 rounded-xl text-xs border border-slate-100 flex flex-col items-center justify-center gap-2 cursor-pointer">
                    <i class="fas fa-file-import text-lg text-indigo-600"></i> Excel Import
                    <input type="file" class="hidden" accept=".xlsx, .xls, .csv" onchange="importData(this)">
                </label>
            </div>

            <button onclick="exportBackupJSON()" class="w-full bg-indigo-50 text-indigo-700 p-4 rounded-xl font-bold flex items-center justify-center gap-2 border border-indigo-100 mt-2">
                <i class="fas fa-database"></i> Komplettes JSON-Backup laden
            </button>

            <button onclick="handleLogout()" class="w-full bg-slate-900 text-white p-4 rounded-xl font-bold mt-4">
                Abmelden
            </button>
        </div>
    </div>

    <div id="addModal" class="hidden fixed inset-0 bg-slate-900/60 z-[600] flex items-end sm:items-center justify-center">
        <div class="bg-white w-full max-w-lg rounded-t-[2.5rem] sm:rounded-[2.5rem] p-8 shadow-2xl overflow-y-auto max-h-[90vh]">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-black" id="modalTitle">Neuer Eintrag</h3>
                <button onclick="closeModal('addModal')"><i class="fas fa-times text-slate-400 text-xl"></i></button>
            </div>
            <form id="expenseForm" class="space-y-4" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="editId">
                <div class="grid grid-cols-2 gap-4">
                    <input type="number" id="betrag" placeholder="0,00" step="0.01" required class="p-4 bg-slate-50 rounded-2xl text-xl font-bold outline-none border-2 border-transparent focus:border-indigo-500">
                    <input type="date" id="datum" required class="p-4 bg-slate-50 rounded-2xl font-bold outline-none border-2 border-transparent focus:border-indigo-500">
                </div>
                <input type="text" id="beschreibung" placeholder="Beschreibung" required class="w-full p-4 bg-slate-50 rounded-2xl font-bold outline-none border-2 border-transparent focus:border-indigo-500">
                
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mt-4 mb-2">Kategorie</label>
                <div id="categoryGrid" class="flex flex-wrap gap-2 mb-4"></div>
                
                <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-5 rounded-2xl shadow-lg mt-4">Speichern</button>
                <button type="button" id="deleteBtn" onclick="deleteCurrentEntry()" class="hidden w-full text-rose-500 font-bold py-4 rounded-2xl bg-rose-50 mt-2">Eintrag löschen</button>
            </form>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD1zzt4pZzyNxMDWpc5MG2aPRecHKQG7IE",
            authDomain: "meinbudgetcloud.firebaseapp.com",
            projectId: "meinbudgetcloud",
            storageBucket: "meinbudgetcloud.firebasestorage.app",
            messagingSenderId: "594713378906",
            appId: "1:594713378906:web:7929f7a875159336101863"
        };

        let db, currentUser;
        let expenses = [], categories = [];
        let activeFilter = 'all', selectedCategory = '';

        window.onload = function() {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            
            // Offline Persistence aktivieren
            db.enablePersistence({synchronizeTabs: true}).catch((err) => {
                console.warn("Offline Persistence Info: ", err.code);
            });

            firebase.auth().onAuthStateChanged(user => {
                if (user) {
                    currentUser = user;
                    updateOnlineStatus();
                    document.getElementById('authScreen').classList.add('hidden');
                    document.getElementById('mainApp').classList.remove('hidden');
                    startSync();
                } else {
                    currentUser = null;
                    document.getElementById('mainApp').classList.add('hidden');
                    document.getElementById('authScreen').classList.remove('hidden');
                    hideSplash();
                }
            });

            window.addEventListener('online', updateOnlineStatus);
            window.addEventListener('offline', updateOnlineStatus);
        };

        function updateOnlineStatus() {
            const indicator = document.getElementById('cloudStatus');
            if (!indicator) return;
            if (navigator.onLine) {
                indicator.className = 'w-2 h-2 rounded-full bg-emerald-500';
            } else {
                indicator.className = 'w-2 h-2 rounded-full bg-amber-500';
                showToast("Offline-Modus aktiv");
            }
        }

        // --- AUTH LOGIK ---
        async function handleLogin() {
            const email = document.getElementById('authEmail').value;
            const pass = document.getElementById('authPassword').value;
            if(!email || !pass) return showToast("Bitte Daten eingeben");
            try {
                await firebase.auth().signInWithEmailAndPassword(email, pass);
            } catch(e) { showToast("Login fehlgeschlagen: " + e.message); }
        }

        async function handleRegister() {
            const email = document.getElementById('authEmail').value;
            const pass = document.getElementById('authPassword').value;
            if(!email || !pass) return showToast("Bitte Daten eingeben");
            try {
                const cred = await firebase.auth().createUserWithEmailAndPassword(email, pass);
                await db.collection('users').doc(cred.user.uid).collection('categories').add({name: 'Allgemein'});
                await db.collection('users').doc(cred.user.uid).collection('categories').add({name: 'Lebensmittel'});
            } catch(e) { showToast("Fehler bei Registrierung: " + e.message); }
        }

        function handleLogout() { 
            firebase.auth().signOut().then(() => location.reload()); 
        }

        // --- SYNC & RENDER ---
        function startSync() {
            const userRef = db.collection('users').doc(currentUser.uid);
            
            userRef.collection('categories').onSnapshot(snap => {
                categories = snap.docs.map(d => ({id: d.id, ...d.data()}));
                renderFilters();
                renderCategoryGrid();
            });
            
            userRef.collection('ausgaben').onSnapshot(snap => {
                expenses = snap.docs.map(d => ({id: d.id, ...d.data()}));
                expenses.sort((a,b) => new Date(b.datum) - new Date(a.datum));
                renderUI();
                renderStats();
                hideSplash();
            });
        }

        function renderUI() {
            const list = document.getElementById('expenseList');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filtered = expenses.filter(e => 
                (activeFilter === 'all' || e.kategorieId === activeFilter) && 
                e.beschreibung.toLowerCase().includes(search)
            );
            
            let total = 0;
            list.innerHTML = filtered.map(e => {
                const cat = categories.find(c => c.id === e.kategorieId);
                total += parseFloat(e.betrag);
                return `
                <div class="bg-white p-5 rounded-3xl shadow-sm flex justify-between items-center cursor-pointer active:scale-95 transition-transform" onclick="editExpense('${e.id}')">
                    <div>
                        <p class="font-black text-slate-900">${e.beschreibung}</p>
                        <p class="text-[10px] font-bold text-slate-400 uppercase mt-1">
                            <i class="far fa-calendar-alt mr-1"></i>${new Date(e.datum).toLocaleDateString('de-DE')} • ${cat?.name || 'Diverse'}
                        </p>
                    </div>
                    <p class="font-black text-slate-900 text-lg">-${parseFloat(e.betrag).toFixed(2).replace('.', ',')} €</p>
                </div>`;
            }).join('');
            
            document.getElementById('totalAmount').innerText = total.toLocaleString('de-DE', {style:'currency', currency:'EUR'});
            document.getElementById('totalCountBadge').innerText = `${expenses.length} Einträge`;
        }

        function renderStats() {
            const now = new Date();
            const monthExpenses = expenses.filter(e => new Date(e.datum).getMonth() === now.getMonth() && new Date(e.datum).getFullYear() === now.getFullYear());
            const monthTotal = monthExpenses.reduce((acc, e) => acc + parseFloat(e.betrag), 0);
            
            document.getElementById('monthSpending').innerText = monthTotal.toLocaleString('de-DE', {style:'currency', currency:'EUR'});
            document.getElementById('monthCountBadge').innerText = `${monthExpenses.length} Buchungen`;
            document.getElementById('monthBarFill').style.width = Math.min((monthTotal / 2000) * 100, 100) + "%";
            
            const monthNames = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
            document.getElementById('monthLabel').innerText = monthNames[now.getMonth()];
        }

        function renderFilters() {
            document.getElementById('filterBar').innerHTML = 
                `<button onclick="setFilter('all')" class="px-5 py-2.5 rounded-xl text-xs font-bold transition-colors ${activeFilter==='all'?'bg-slate-900 text-white shadow-md':'bg-slate-100 text-slate-500'}">Alle</button>` + 
                categories.map(c => `<button onclick="setFilter('${c.id}')" class="px-5 py-2.5 rounded-xl text-xs font-bold whitespace-nowrap transition-colors ${activeFilter===c.id?'bg-slate-900 text-white shadow-md':'bg-slate-100 text-slate-500'}">${c.name}</button>`).join('');
        }

        function renderCategoryGrid() {
            document.getElementById('categoryGrid').innerHTML = categories.map(c => 
                `<button type="button" onclick="selectedCategory='${c.id}';renderCategoryGrid()" 
                class="px-4 py-3 rounded-xl border-2 text-[10px] font-bold uppercase transition-all
                ${selectedCategory===c.id?'border-indigo-600 bg-indigo-50 text-indigo-600':'border-transparent bg-slate-100 text-slate-500'}">${c.name}</button>`
            ).join('');
        }

        // --- CRUD LOGIK ---
        async function handleFormSubmit(e) {
            e.preventDefault();
            if (!currentUser) return;
            
            const id = document.getElementById('editId').value;
            const data = {
                betrag: parseFloat(document.getElementById('betrag').value),
                datum: document.getElementById('datum').value,
                beschreibung: document.getElementById('beschreibung').value,
                kategorieId: selectedCategory || categories[0]?.id
            };
            
            try {
                const col = db.collection('users').doc(currentUser.uid).collection('ausgaben');
                if (id) {
                    await col.doc(id).update(data);
                    showToast("Eintrag aktualisiert");
                } else {
                    await col.add(data);
                    showToast("Eintrag gespeichert");
                }
                closeModal('addModal');
            } catch (err) { showToast("Fehler beim Speichern"); }
        }

        window.editExpense = id => {
            const e = expenses.find(x => x.id === id);
            if(!e) return;
            
            document.getElementById('modalTitle').innerText = "Eintrag bearbeiten";
            document.getElementById('editId').value = e.id;
            document.getElementById('betrag').value = e.betrag;
            document.getElementById('beschreibung').value = e.beschreibung;
            document.getElementById('datum').value = e.datum;
            selectedCategory = e.kategorieId;
            
            document.getElementById('deleteBtn').classList.remove('hidden');
            document.getElementById('addModal').classList.remove('hidden');
            renderCategoryGrid();
        };

        document.getElementById('addExpenseBtn').onclick = () => {
            document.getElementById('modalTitle').innerText = "Neuer Eintrag";
            document.getElementById('expenseForm').reset();
            document.getElementById('editId').value = '';
            document.getElementById('datum').value = new Date().toISOString().split('T')[0];
            document.getElementById('deleteBtn').classList.add('hidden');
            
            selectedCategory = categories[0]?.id;
            document.getElementById('addModal').classList.remove('hidden');
            renderCategoryGrid();
        };

        async function deleteCurrentEntry() {
            if(!confirm("Eintrag wirklich löschen?")) return;
            const id = document.getElementById('editId').value;
            if(id && currentUser) {
                await db.collection('users').doc(currentUser.uid).collection('ausgaben').doc(id).delete();
                showToast("Eintrag gelöscht");
                closeModal('addModal');
            }
        }

        // --- EXPORT / IMPORT LOGIK ---
        function exportToCSV() {
            if(!expenses.length) return showToast("Keine Daten zum Exportieren");
            
            const exportData = expenses.map(e => {
                const catName = categories.find(c => c.id === e.kategorieId)?.name || 'Diverse';
                return {
                    Datum: e.datum,
                    Beschreibung: e.beschreibung,
                    Kategorie: catName,
                    Betrag: e.betrag
                };
            });
            
            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Ausgaben");
            XLSX.writeFile(wb, `Budget_Export_${new Date().toISOString().split('T')[0]}.xlsx`);
            showToast("Excel Export erfolgreich!");
        }

        function importData(input) {
            const file = input.files[0];
            if(!file || !currentUser) return;
            
            showToast("Lese Datei...");
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(sheet);
                    
                    let importCount = 0;
                    const col = db.collection('users').doc(currentUser.uid).collection('ausgaben');
                    const defaultCatId = categories[0]?.id;
                    
                    for(let row of json) {
                        if (row.Betrag && row.Beschreibung) {
                            await col.add({
                                datum: row.Datum || new Date().toISOString().split('T')[0],
                                beschreibung: row.Beschreibung,
                                betrag: parseFloat(row.Betrag),
                                kategorieId: defaultCatId
                            });
                            importCount++;
                        }
                    }
                    showToast(`${importCount} Einträge importiert!`);
                    closeModal('dataModal');
                    input.value = ''; // Reset file input
                } catch(err) { 
                    console.error(err);
                    showToast("Fehler beim Importieren der Datei"); 
                }
            };
            reader.readAsArrayBuffer(file);
        }

        async function exportBackupJSON() {
            if (!currentUser) return showToast("Bitte zuerst anmelden!");
            
            showToast("Backup wird erstellt...");
            try {
                const userRef = db.collection('users').doc(currentUser.uid);
                const catSnap = await userRef.collection('categories').get();
                const expSnap = await userRef.collection('ausgaben').get();
                
                const backupData = {
                    exportDatum: new Date().toISOString(),
                    kategorien: catSnap.docs.map(doc => ({ id: doc.id, ...doc.data() })),
                    ausgaben: expSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }))
                };
                
                const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `budget_backup_${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                showToast("Backup erfolgreich heruntergeladen!");
                closeModal('dataModal');
            } catch (error) {
                showToast("Fehler beim Backup: " + error.message);
            }
        }

        // --- SERVICE WORKER (PWA) ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    const CACHE_NAME = 'budget-pro-v2';
                    self.addEventListener('install', e => {
                        e.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll(['./'])));
                    });
                    self.addEventListener('fetch', e => {
                        e.respondWith(caches.match(e.request).then(res => res || fetch(e.request)));
                    });
                `;
                const blob = new Blob([swCode], {type: 'application/javascript'});
                const swUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(swUrl).catch(console.warn);
            });
        }

        // --- HILFSFUNKTIONEN ---
        function showToast(m) { const t=document.getElementById('toast'); t.innerText=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000); }
        function hideSplash() { document.getElementById('splashScreen').style.opacity='0'; setTimeout(()=>document.getElementById('splashScreen').style.display='none',500); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function setFilter(id) { activeFilter = id; renderFilters(); renderUI(); }
    </script>
</body>
</html>
