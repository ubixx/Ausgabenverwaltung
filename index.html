<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Budget Cloud | Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <script src="https://apis.google.com/js/api.js"></script>
    <script src="https://accounts.google.com/gsi/client"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Entfernt den blauen Rahmen beim Klicken auf Handys */
        * { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <div class="max-w-md mx-auto p-4 pb-24">
        
        <header class="flex justify-between items-center mb-6 pt-2">
            <h1 class="text-2xl font-black text-blue-600 tracking-tight">BUDGET<span class="text-gray-800">CLOUD</span></h1>
            <div id="userAvatar" class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold border-2 border-white shadow-sm">
                ?
            </div>
        </header>

        <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100">
            <div class="bg-blue-600 p-5">
                <h2 class="text-white font-bold text-lg flex items-center gap-2">
                    <span>📝</span> Neuer Eintrag
                </h2>
            </div>
            
            <div class="p-6 space-y-5">
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-1 ml-1">Beschreibung</label>
                    <input type="text" id="beschreibung" 
                           class="w-full p-4 text-base bg-gray-50 border-2 border-transparent focus:border-blue-500 focus:bg-white rounded-2xl transition-all outline-none" 
                           placeholder="Was hast du gekauft?">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-1 ml-1">Betrag (€)</label>
                        <input type="number" id="betrag" step="0.01"
                               class="w-full p-4 text-base font-bold bg-gray-50 border-2 border-transparent focus:border-blue-500 focus:bg-white rounded-2xl outline-none" 
                               placeholder="0,00">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-1 ml-1">Datum</label>
                        <input type="date" id="datum"
                               class="w-full p-4 text-base bg-gray-50 border-2 border-transparent focus:border-blue-500 focus:bg-white rounded-2xl outline-none">
                    </div>
                </div>

                <div class="pt-2">
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 ml-1">Beleg (Optional)</label>
                    <button onclick="openDrivePicker()" 
                            class="w-full flex items-center justify-center gap-3 bg-gray-50 hover:bg-gray-100 text-gray-600 font-semibold py-4 rounded-2xl border-2 border-dashed border-gray-300 transition-all active:scale-95">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/1/12/Google_Drive_icon_%282020%29.svg" class="w-5 h-5">
                        <span id="driveStatus">PDF aus Drive wählen</span>
                    </button>
                    <input type="hidden" id="manualLink">
                </div>

                <button onclick="speichern()" 
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-5 rounded-2xl shadow-lg shadow-blue-200 active:scale-95 transition-all text-lg mt-4">
                    Eintrag speichern
                </button>
            </div>
        </div>

        <div class="mt-10">
            <h3 class="text-gray-500 font-bold text-sm uppercase tracking-widest mb-4 ml-1">Letzte Ausgaben</h3>
            <div id="liste" class="space-y-3">
                </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full text-sm font-medium shadow-2xl opacity-0 transition-opacity pointer-events-none">
    </div>

    <script>
        // === 1. KONFIGURATION (Bitte hier deine Daten eintragen) ===
         const firebaseConfig = {
            apiKey: "AIzaSyD1zzt4pZzyNxMDWpc5MG2aPRecHKQG7IE",
            authDomain: "meinbudgetcloud.firebaseapp.com",
            projectId: "meinbudgetcloud",
            storageBucket: "meinbudgetcloud.firebasestorage.app",
            messagingSenderId: "594713378906",
            appId: "1:594713378906:web:7929f7a875159336101863"
        };

        const DRIVE_API_KEY = 'AIzaSyD1zzt4pZzyNxMDWpc5MG2aPRecHKQG7IE';
        const DRIVE_CLIENT_ID = '594713378906-k8ivighcb2f02vemis1ngneu54418btp.apps.googleusercontent.com';
        const SCOPES = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.readonly';

        // === 2. INITIALISIERUNG ===
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let tokenClient;
        let accessToken = null;
        let pickerInited = false;
        let gapiInited = false;

        // Datum auf heute setzen
        document.getElementById('datum').valueAsDate = new Date();

        // Google Libs laden
        function gapiLoaded() {
            gapi.load('client:picker', async () => {
                await gapi.client.init({ apiKey: DRIVE_API_KEY, discoveryDocs: ["https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"] });
                gapiInited = true;
            });
        }

        function gisLoaded() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: DRIVE_CLIENT_ID,
                scope: SCOPES,
                callback: (response) => {
                    if (response.error) return;
                    accessToken = response.access_token;
                    createPicker();
                },
            });
            pickerInited = true;
        }

        // === 3. FUNKTIONEN ===

        function openDrivePicker() {
            if (!accessToken) {
                tokenClient.requestAccessToken({prompt: 'consent'});
            } else {
                createPicker();
            }
        }

        function createPicker() {
            const view = new google.picker.DocsView(google.picker.ViewId.PDFS);
            const picker = new google.picker.PickerBuilder()
                .addView(view)
                .setOAuthToken(accessToken)
                .setDeveloperKey(DRIVE_API_KEY)
                .setCallback(pickerCallback)
                .build();
            picker.setVisible(true);
        }

        function pickerCallback(data) {
            if (data[google.picker.Response.ACTION] == google.picker.Action.PICKED) {
                const doc = data[google.picker.Response.DOCUMENTS][0];
                document.getElementById('manualLink').value = doc[google.picker.Document.URL];
                document.getElementById('driveStatus').innerText = "📎 Beleg verknüpft";
                if(!document.getElementById('beschreibung').value) {
                    document.getElementById('beschreibung').value = doc[google.picker.Document.NAME].replace('.pdf', '');
                }
                showToast("PDF verknüpft!");
            }
        }

        async function speichern() {
            const b = document.getElementById('beschreibung').value;
            const v = document.getElementById('betrag').value;
            const d = document.getElementById('datum').value;
            const l = document.getElementById('manualLink').value;

            if(!b || !v) {
                showToast("Bitte alles ausfüllen!");
                return;
            }

            try {
                await db.collection('budget').add({
                    beschreibung: b,
                    betrag: parseFloat(v),
                    datum: d,
                    link: l,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                showToast("Gespeichert!");
                // Reset
                document.getElementById('beschreibung').value = "";
                document.getElementById('betrag').value = "";
                document.getElementById('manualLink').value = "";
                document.getElementById('driveStatus').innerText = "PDF aus Drive wählen";
                laden();
            } catch (e) {
                showToast("Fehler beim Speichern");
            }
        }

        function laden() {
            db.collection('budget').orderBy('datum', 'desc').limit(10).onSnapshot(snap => {
                const liste = document.getElementById('liste');
                liste.innerHTML = "";
                snap.forEach(doc => {
                    const item = doc.data();
                    const card = `
                        <div class="bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center border border-gray-50">
                            <div>
                                <p class="font-bold text-gray-800">${item.beschreibung}</p>
                                <p class="text-xs text-gray-400">${item.datum} ${item.link ? '• 📎 Beleg' : ''}</p>
                            </div>
                            <div class="text-right">
                                <p class="font-black text-blue-600">-${item.betrag.toFixed(2)} €</p>
                            </div>
                        </div>
                    `;
                    liste.innerHTML += card;
                });
            });
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.opacity = "1";
            setTimeout(() => t.style.opacity = "0", 3000);
        }

        // Start
        window.onload = () => {
            gapiLoaded();
            gisLoaded();
            laden();
        };
    </script>
</body>
</html>
