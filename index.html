<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/10149/10149458.png">

    <title>Budget Cloud | Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://apis.google.com/js/api.js"></script>
    <script src="https://accounts.google.com/gsi/client"></script>
    <style>
        :root { --app-primary: #6366f1; --app-bg: #f8fafc; }
        body { background-color: var(--app-bg); -webkit-tap-highlight-color: transparent; padding-top: env(safe-area-inset-top); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        #toast { visibility: hidden; min-width: 280px; background-color: #1e293b; color: #fff; text-align: center; border-radius: 16px; padding: 20px; position: fixed; z-index: 9999; left: 50%; bottom: 40px; transform: translateX(-50%); font-weight: bold; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 40px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 40px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body class="min-h-screen font-sans text-slate-800">
    <div id="toast">Nachricht</div>

    <div id="splashScreen" class="fixed inset-0 bg-white z-[1000] flex flex-col items-center justify-center p-8 transition-opacity duration-500">
        <div class="w-20 h-20 bg-indigo-600 text-white rounded-3xl flex items-center justify-center text-4xl mb-4 shadow-2xl animate-pulse"><i class="fas fa-wallet"></i></div>
        <p class="text-slate-400 font-bold text-xs uppercase tracking-widest">Budget Cloud lädt...</p>
    </div>

    <div id="authScreen" class="hidden min-h-screen flex flex-col items-center justify-center p-6 bg-slate-50 z-50">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] p-8 shadow-2xl text-center">
            <h2 class="text-2xl font-black text-slate-900 mb-6">Login</h2>
            <form id="authForm" class="space-y-4" onsubmit="event.preventDefault()">
                <input type="email" id="authEmail" placeholder="E-Mail" required class="w-full p-4 bg-slate-50 rounded-2xl font-bold outline-none border-2 border-transparent focus:border-indigo-500 text-center">
                <input type="password" id="authPassword" placeholder="Passwort" required class="w-full p-4 bg-slate-50 rounded-2xl font-bold outline-none border-2 border-transparent focus:border-indigo-500 text-center">
                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="handleLogin()" class="flex-1 bg-indigo-600 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition-transform">Login</button>
                    <button type="button" onclick="handleRegister()" class="flex-1 bg-slate-900 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition-transform">Neu</button>
                </div>
            </form>
        </div>
    </div>

    <div id="mainApp" class="hidden flex flex-col min-h-screen">
        <header class="p-6 bg-white border-b border-slate-100 sticky top-0 z-30">
            <div class="flex justify-between items-start">
                <div><h1 class="text-3xl font-black text-slate-900" id="totalAmount">0,00 €</h1><p class="text-slate-400 font-bold text-xs uppercase tracking-widest" id="totalCountBadge">0 Einträge</p></div>
                <button onclick="document.getElementById('dataModal').classList.remove('hidden')" class="w-12 h-12 bg-slate-50 text-slate-900 rounded-2xl flex items-center justify-center text-xl transition-transform active:scale-90"><i class="fas fa-cog"></i></button>
            </div>
        </header>

        <div class="px-6 py-4 bg-white/95 backdrop-blur-md sticky top-[85px] z-20 border-b border-slate-100">
            <div class="flex gap-2 relative">
                <div class="relative flex-1">
                    <input type="text" id="searchInput" placeholder="Suchen..." onkeyup="renderUI()" class="w-full p-4 pl-12 bg-slate-100 border-none rounded-2xl text-sm font-bold outline-none">
                    <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                </div>
                <select id="yearFilter" onchange="setYearFilter(this.value)" class="p-4 bg-slate-100 border-none rounded-2xl text-sm font-bold outline-none text-slate-700 cursor-pointer appearance-none text-center min-w-[100px]">
                    <option value="all">Alle Jahre</option>
                </select>
            </div>
            <div id="filterBar" class="mt-4 flex gap-2 overflow-x-auto no-scrollbar pb-1"></div>
        </div>

        <div id="expenseList" class="flex-1 p-6 space-y-4 pb-32"></div>

        <div class="fixed bottom-0 left-0 right-0 p-6 flex justify-center z-40 mb-[env(safe-area-inset-bottom)]">
            <button id="addExpenseBtn" class="w-full max-w-md bg-indigo-600 text-white font-bold py-5 rounded-2xl flex items-center justify-center gap-3 shadow-xl active:scale-95 transition-transform"><i class="fas fa-plus"></i> Neuer Eintrag</button>
        </div>
    </div>

    <div id="dataModal" class="hidden fixed inset-0 bg-slate-900/60 z-[700] flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] p-8 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-2"><h3 class="text-xl font-black">Verwaltung</h3><button onclick="closeModal('dataModal')"><i class="fas fa-times text-slate-400 text-xl"></i></button></div>
            <button onclick="exportToExcel()" class="w-full bg-emerald-50 text-emerald-700 p-4 rounded-xl text-sm font-black flex items-center justify-center gap-2 border-2 border-emerald-100 shadow-sm"><i class="fas fa-file-excel"></i> Excel Export</button>
            <div class="bg-slate-50 p-5 rounded-2xl border-2 border-dashed border-slate-200">
                <input type="file" id="importExcel" accept=".xlsx, .xls" class="hidden" onchange="handleImport(this)">
                <button onclick="document.getElementById('importExcel').click()" class="w-full bg-white text-slate-600 p-3 rounded-xl text-xs font-bold shadow-sm border border-slate-200"><i class="fas fa-file-import mr-2"></i> Excel Import</button>
            </div>
            <div class="border-t border-slate-100 pt-4">
                <label class="text-[10px] font-bold text-slate-400 uppercase block mb-2">Kategorien</label>
                <div id="manageCatsList" class="space-y-2 mb-4"></div>
                <div class="flex gap-2">
                    <input type="text" id="newCatName" placeholder="Neue Kat..." class="flex-1 p-3 bg-slate-50 rounded-xl text-sm font-bold outline-none">
                    <button onclick="addCategory()" class="bg-indigo-600 text-white px-4 rounded-xl"><i class="fas fa-plus"></i></button>
                </div>
            </div>
            <button onclick="handleLogout()" class="w-full bg-slate-900 text-white p-4 rounded-xl font-bold mt-2">Abmelden</button>
        </div>
    </div>

    <div id="addModal" class="hidden fixed inset-0 bg-slate-900/60 z-[600] flex items-end sm:items-center justify-center">
        <div class="bg-white w-full max-w-lg rounded-t-[2.5rem] sm:rounded-[2.5rem] p-8 shadow-2xl max-h-[95vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6"><h3 class="text-xl font-black" id="modalTitle">Eintrag</h3><button onclick="closeModal('addModal')"><i class="fas fa-times text-slate-400"></i></button></div>
            <form id="expenseForm" class="space-y-5" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="editId">
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1"><label class="text-[10px] font-bold text-slate-400 uppercase px-1">Betrag (€)</label><input type="number" id="betrag" placeholder="0,00" step="0.01" required class="w-full p-4 bg-slate-50 rounded-2xl text-xl font-black outline-none border-2 border-transparent focus:border-indigo-500 text-center"></div>
                    <div class="space-y-1"><label class="text-[10px] font-bold text-slate-400 uppercase px-1">Datum</label><input type="date" id="datum" required class="w-full p-4 bg-slate-50 rounded-2xl font-bold outline-none border-2 border-transparent focus:border-indigo-500"></div>
                </div>
                <input type="text" id="beschreibung" placeholder="Beschreibung" required class="w-full p-4 bg-slate-50 rounded-2xl font-bold outline-none border-2 border-transparent focus:border-indigo-500">
                <div class="bg-slate-50 border-2 border-slate-100 rounded-3xl p-5 space-y-3">
                    <div class="flex gap-2">
                        <input type="url" id="manualLink" placeholder="Beleg Link" class="flex-1 p-4 bg-white rounded-2xl text-sm border border-slate-200 outline-none">
                        <button type="button" onclick="openDrivePicker()" class="w-12 h-14 bg-white border border-slate-200 text-blue-500 rounded-2xl flex items-center justify-center"><i class="fab fa-google-drive"></i></button>
                    </div>
                </div>
                <select id="categoryDropdown" class="w-full p-4 bg-slate-50 rounded-2xl font-bold outline-none"></select>
                <button type="submit" id="saveBtn" class="w-full bg-indigo-600 text-white font-black py-5 rounded-2xl shadow-xl active:scale-95 transition-transform">Speichern</button>
                <button type="button" id="deleteBtn" onclick="deleteCurrentEntry()" class="hidden w-full text-rose-500 font-bold py-2">Löschen</button>
            </form>
        </div>
    </div>

    <script>
        // === PWA & SERVICE WORKER ===
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => console.log("SW registered"));
        }

        const firebaseConfig = {
            apiKey: "AIzaSyD1zzt4pZzyNxMDWpc5MG2aPRecHKQG7IE",
            authDomain: "meinbudgetcloud.firebaseapp.com",
            projectId: "meinbudgetcloud",
            storageBucket: "meinbudgetcloud.firebasestorage.app",
            messagingSenderId: "594713378906",
            appId: "1:594713378906:web:7929f7a875159336101863"
        };
        
        const DRIVE_API_KEY = 'AIzaSyD1zzt4pZzyNxMDWpc5MG2aPRecHKQG7IE';
        const DRIVE_CLIENT_ID = '594713378906-k8ivighcb2f02vemis1ngneu54418btp.apps.googleusercontent.com';
        const SCOPES = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.readonly';
        
        let db, currentUser, tokenClient, accessToken = null, pickerInited = false;
        let expenses = [], categories = [], activeFilter = 'all', activeYear = 'all', currentFilteredExpenses = [];

        function gapiLoaded() { gapi.load('picker', () => { pickerInited = true; }); }
        function gisLoaded() { 
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: DRIVE_CLIENT_ID, scope: SCOPES, ux_mode: 'popup',
                callback: (resp) => { if(!resp.error) { accessToken = resp.access_token; showPicker(); } }
            });
        }
        
        window.onload = function() {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            
            // OFFLINE PERSISTENCE AKTIVIEREN
            db.enablePersistence().catch(err => console.log("Offline error", err));

            firebase.auth().onAuthStateChanged(user => {
                if (user) { currentUser = user; document.getElementById('authScreen').classList.add('hidden'); document.getElementById('mainApp').classList.remove('hidden'); startSync(); }
                else { currentUser = null; document.getElementById('mainApp').classList.add('hidden'); document.getElementById('authScreen').classList.remove('hidden'); hideSplash(); }
            });
            gapi.load('picker', {callback: gapiLoaded});
            gisLoaded();
        };

        // --- DRIVE PICKER ---
        function openDrivePicker() { if (pickerInited && !accessToken) tokenClient.requestAccessToken({prompt: 'consent'}); else if(pickerInited) showPicker(); }
        function showPicker() {
            const view = new google.picker.DocsView(google.picker.ViewId.PDFS);
            const picker = new google.picker.PickerBuilder()
                .addView(view).setOAuthToken(accessToken).setDeveloperKey(DRIVE_API_KEY)
                .setCallback(pickerCallback).setSize(window.innerWidth*0.95, window.innerHeight*0.85).build();
            picker.setVisible(true);
        }
        function pickerCallback(data) {
            if (data[google.picker.Response.ACTION] == google.picker.Action.PICKED) {
                const doc = data[google.picker.Response.DOCUMENTS][0];
                document.getElementById('manualLink').value = doc[google.picker.Document.URL];
                if(!document.getElementById('beschreibung').value) document.getElementById('beschreibung').value = doc[google.picker.Document.NAME].replace('.pdf', '');
            }
        }

        // --- CORE LOGIK ---
        function startSync() {
            const userRef = db.collection('users').doc(currentUser.uid);
            userRef.collection('categories').onSnapshot(snap => { 
                categories = snap.docs.map(d => ({id: d.id, ...d.data()})); 
                categories.sort((a,b) => a.name.localeCompare(b.name)); 
                renderFilters(); renderCategoryDropdown(); renderManageCatsList(); 
            });
            userRef.collection('ausgaben').onSnapshot(snap => { 
                expenses = snap.docs.map(d => ({id: d.id, ...d.data()})); 
                expenses.sort((a,b) => new Date(b.datum) - new Date(a.datum)); 
                updateYearDropdown(); renderUI(); hideSplash(); 
            });
        }

        function renderUI() {
            const list = document.getElementById('expenseList');
            const search = document.getElementById('searchInput').value.toLowerCase();
            currentFilteredExpenses = expenses.filter(e => 
                (activeFilter === 'all' || e.kategorieId === activeFilter) && 
                (activeYear === 'all' || e.datum.startsWith(activeYear)) && 
                e.beschreibung.toLowerCase().includes(search)
            );
            let total = 0;
            list.innerHTML = currentFilteredExpenses.map(e => {
                const cat = categories.find(c => c.id === e.kategorieId);
                total += parseFloat(e.betrag);
                const clip = e.fotoUrl ? `<a href="${e.fotoUrl}" target="_blank" onclick="event.stopPropagation()" class="inline-flex items-center justify-center w-9 h-9 bg-indigo-50 text-indigo-600 rounded-full mr-3"><i class="fas fa-paperclip"></i></a>` : '';
                return `<div class="bg-white p-5 rounded-3xl shadow-sm flex justify-between items-center border border-slate-50 mb-4" onclick="editExpense('${e.id}')"><div class="flex items-center">${clip}<div><p class="font-black text-slate-900">${e.beschreibung}</p><p class="text-xs font-bold text-slate-500 mt-1">${formatToGermanDate(e.datum)} • ${cat?.name || 'Allgemein'}</p></div></div><p class="font-black text-slate-900 text-lg">-${parseFloat(e.betrag).toFixed(2).replace('.', ',')} €</p></div>`;
            }).join('');
            document.getElementById('totalAmount').innerText = total.toLocaleString('de-DE', {style:'currency', currency:'EUR'});
            document.getElementById('totalCountBadge').innerText = `${currentFilteredExpenses.length} Einträge`;
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const data = { betrag: parseFloat(document.getElementById('betrag').value), datum: document.getElementById('datum').value, beschreibung: document.getElementById('beschreibung').value, kategorieId: document.getElementById('categoryDropdown').value, fotoUrl: document.getElementById('manualLink').value.trim() };
            const col = db.collection('users').doc(currentUser.uid).collection('ausgaben');
            id ? await col.doc(id).update(data) : await col.add(data);
            closeModal('addModal');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function parseToIsoDate(str) { 
            if (!str) return new Date().toISOString().split('T')[0]; 
            const s = String(str).trim(); 
            if (s.includes('-')) return s; 
            const p = s.split('.'); 
            return p.length === 3 ? `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}` : new Date().toISOString().split('T')[0]; 
        }

        async function handleImport(input) {
            if (!input.files[0]) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                const data = new Uint8Array(e.target.result);
                const wb = XLSX.read(data, { type: 'array' });
                const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                const userRef = db.collection('users').doc(currentUser.uid);
                let added = 0, skipped = 0;
                showToast("Import läuft...");
                for (const row of json) {
                    const datum = parseToIsoDate(row.Datum);
                    const betrag = parseFloat(String(row['Betrag (€)'] || 0).replace(',', '.'));
                    const desc = row.Beschreibung || 'Import';
                    const isDup = expenses.some(exp => exp.datum === datum && exp.beschreibung === desc && Math.abs(parseFloat(exp.betrag) - betrag) < 0.01);
                    if (isDup) { skipped++; continue; }
                    const catName = (row.Kategorie || 'Allgemein').trim();
                    let kat = categories.find(c => c.name.toLowerCase() === catName.toLowerCase());
                    let katId = kat ? kat.id : (await userRef.collection('categories').add({name: catName})).id;
                    await userRef.collection('ausgaben').add({ datum, beschreibung: desc, betrag, kategorieId: katId, fotoUrl: row.Link || '' });
                    added++;
                }
                showToast(`Fertig! ${added} neu, ${skipped} Duplikate.`);
                closeModal('dataModal');
            };
            reader.readAsArrayBuffer(input.files[0]);
        }

        // --- HELPERS ---
        function formatToGermanDate(iso) { if (!iso) return ''; const p = iso.split('-'); return p.length === 3 ? `${p[2]}.${p[1]}.${p[0]}` : iso; }
        function showToast(m) { const t=document.getElementById('toast'); t.innerText=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000); }
        function hideSplash() { const s=document.getElementById('splashScreen'); s.style.opacity='0'; setTimeout(()=>s.style.display='none',500); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        async function handleLogin() { try { await firebase.auth().signInWithEmailAndPassword(document.getElementById('authEmail').value, document.getElementById('authPassword').value); } catch(e) { showToast("Fehler"); } }
        async function handleRegister() { try { const c = await firebase.auth().createUserWithEmailAndPassword(document.getElementById('authEmail').value, document.getElementById('authPassword').value); await db.collection('users').doc(c.user.uid).collection('categories').add({name: 'Allgemein'}); } catch(e) { showToast("Fehler"); } }
        function handleLogout() { firebase.auth().signOut().then(() => location.reload()); }
        window.editExpense = id => { 
            const e = expenses.find(x => x.id === id); 
            document.getElementById('modalTitle').innerText = "Bearbeiten"; 
            document.getElementById('editId').value = e.id; document.getElementById('betrag').value = e.betrag; 
            document.getElementById('beschreibung').value = e.beschreibung; document.getElementById('datum').value = e.datum; 
            document.getElementById('manualLink').value = e.fotoUrl || ''; document.getElementById('categoryDropdown').value = e.kategorieId; 
            document.getElementById('deleteBtn').classList.remove('hidden'); document.getElementById('addModal').classList.remove('hidden'); 
        };
        document.getElementById('addExpenseBtn').onclick = () => { document.getElementById('expenseForm').reset(); document.getElementById('editId').value = ''; document.getElementById('datum').value = new Date().toISOString().split('T')[0]; document.getElementById('deleteBtn').classList.add('hidden'); document.getElementById('addModal').classList.remove('hidden'); };
        function renderCategoryDropdown() { document.getElementById('categoryDropdown').innerHTML = categories.map(c => `<option value="${c.id}">${c.name}</option>`).join(''); }
        function renderFilters() { document.getElementById('filterBar').innerHTML = `<button onclick="setFilter('all')" class="px-5 py-2.5 rounded-xl text-xs font-bold ${activeFilter==='all'?'bg-slate-900 text-white':'bg-slate-100'}">Alle</button>` + categories.map(c => `<button onclick="setFilter('${c.id}')" class="px-5 py-2.5 rounded-xl text-xs font-bold whitespace-nowrap ${activeFilter===c.id?'bg-slate-900 text-white':'bg-slate-100'}">${c.name}</button>`).join(''); }
        function setFilter(id) { activeFilter = id; renderFilters(); renderUI(); }
        function setYearFilter(y) { activeYear = y; renderUI(); }
        function updateYearDropdown() { 
            const yrs = [...new Set(expenses.map(e => e.datum.substring(0,4)))].sort((a,b) => b-a); 
            const s = document.getElementById('yearFilter'); 
            s.innerHTML = `<option value="all">Alle Jahre</option>` + yrs.map(y => `<option value="${y}">${y}</option>`).join(''); 
            s.value = activeYear;
        }
        async function addCategory() { const n = document.getElementById('newCatName').value.trim(); if(n) await db.collection('users').doc(currentUser.uid).collection('categories').add({ name: n }); document.getElementById('newCatName').value = ''; }
        function renderManageCatsList() { document.getElementById('manageCatsList').innerHTML = categories.map(c => `<div class="flex justify-between items-center bg-slate-50 p-2 rounded-xl text-sm font-bold">${c.name}</div>`).join(''); }
        async function deleteCurrentEntry() { if(confirm("Löschen?")) { await db.collection('users').doc(currentUser.uid).collection('ausgaben').doc(document.getElementById('editId').value).delete(); closeModal('addModal'); } }
        function exportToExcel() { 
            const data = currentFilteredExpenses.map(e => ({ Datum: formatToGermanDate(e.datum), Beschreibung: e.beschreibung, Kategorie: (categories.find(c => c.id === e.kategorieId))?.name || 'Allgemein', 'Betrag (€)': parseFloat(e.betrag).toFixed(2).replace('.', ','), Link: e.fotoUrl || '' })); 
            const ws = XLSX.utils.json_to_sheet(data); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Budget"); XLSX.writeFile(wb, "Budget_Cloud.xlsx"); 
        }
    </script>
</body>
</html>
